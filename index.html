<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#203a32" />
    <title>Bestiariusz Śródziemia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="overrides.css" />
  </head>
  <body>
    <main class="shell">
      <nav class="tabs" aria-label="Główna nawigacja">
        <button class="tab active" data-tab="generator">Generator</button>
        <button class="tab" data-tab="battle">Aktywna walka <span id="battle-count">0</span></button>
        <button class="tab" data-tab="library">Biblioteka</button>
      </nav>

      <section id="generator" class="page active">
        <div class="section-heading"><div><h2>Stwórz przeciwnika</h2></div><button class="text-button" id="randomize">↻ Wylosuj wszystko</button></div>
        <div class="generator-grid">
          <form class="paper form-card" id="enemy-form">
            <div class="two-fields"><label>Rodzaj<select id="kind"></select></label><label>Poziom zagrożenia<select id="tier"></select></label></div>
            <label>Nazwa<input id="name" required maxlength="50" placeholder="np. Uruk z Czarnej Krainy" /></label>
            <div class="stats-inputs">
              <label><span>Zajadłość <button type="button" class="help-tooltip" aria-label="Wyjaśnienie Zajadłości" data-tooltip="Określa, jak groźnym przeciwnikiem jest dana istota. Wpływa na niektóre Obrażenia specjalne i Mroczne Atrybuty.">?</button></span><input id="fierceness" type="number" min="1" max="20" /></label>
              <label><span>Wytrzymałość <button type="button" class="help-tooltip" aria-label="Wyjaśnienie Wytrzymałości" data-tooltip="Mierzy odporność na obrażenia i wyczerpanie walką. Gdy spadnie do zera, przeciwnik zostaje wyeliminowany z potyczki.">?</button></span><input id="endurance" type="number" min="1" max="99" /></label>
              <label id="resource-label"><span><span id="resource-name">Nienawiść</span> <button type="button" class="help-tooltip" id="resource-help" aria-label="Wyjaśnienie Nienawiści" data-tooltip="Mierzy wolę walki i zasób do używania specjalnych zdolności. Można wydać 1 punkt, aby dodać 1k do testu; bez punktów przeciwnik ulega Wyczerpaniu.">?</button></span><input id="hate" type="number" min="0" max="99" /></label>
              <label><span>Potęga <button type="button" class="help-tooltip" aria-label="Wyjaśnienie Potęgi" data-tooltip="Określa, ile Ran potrzeba, aby pozbawić przeciwnika życia, oraz ile ataków może wykonać w jednej rundzie.">?</button></span><input id="might" type="number" min="0" max="10" /></label>
              <label><span>Obrona <button type="button" class="help-tooltip" aria-label="Wyjaśnienie Obrony" data-tooltip="Jej wartość dodaje się do progu Siły Bohatera, który próbuje sięgnąć tego przeciwnika podczas potyczki.">?</button></span><input id="parry" type="number" min="0" max="20" /></label>
              <label><span>Pancerz <button type="button" class="help-tooltip" aria-label="Wyjaśnienie Pancerza" data-tooltip="Po Przełamaniu Obrony Mistrzyni Wiedzy używa tej wartości do testu Pancerza przeciwnika.">?</button></span><input id="armour" type="number" min="0" max="20" /></label>
            </div>
            <label>Biegłości bojowe<textarea id="attack" rows="2" maxlength="280" placeholder="np. Miecz 3 (3/16), Łuk 2 (3/14, Celny Atak)"></textarea></label>
            <label>Mroczne atrybuty / zdolności<textarea id="traits" rows="3" maxlength="500" placeholder="Krótka wskazówka do odgrywania lub reguła specjalna."></textarea></label>
            <div class="form-actions"><button type="button" class="secondary" id="reset-form">Wyczyść</button><div class="action-buttons"><button type="submit" class="secondary" data-action="library">Dodaj do biblioteki</button><button type="submit" class="primary" data-action="battle">Dodaj do walki →</button></div></div>
          </form>
        </div>
      </section>

      <section id="battle" class="page">
        <div class="section-heading"><div><h2>Aktywna walka</h2></div><button class="text-button danger" id="clear-battle">Wyczyść starcie</button></div>
        <div id="battle-list" class="battle-list"></div>
        <div id="battle-empty" class="empty-state"><span>⚔</span><h3>Jeszcze nikt nie stanął do walki.</h3><p>Dodaj przeciwnika z generatora albo biblioteki.</p></div>
      </section>

      <section id="library" class="page">
        <div class="section-heading"><div><h2>Biblioteka przeciwników</h2></div><div class="library-transfer"><button class="text-button" id="import-data">↓ Importuj</button><button class="text-button" id="export-data">↑ Eksportuj</button></div></div>
        <input id="import-file" type="file" accept="application/json,.json" hidden />
        <div class="library-controls"><input id="library-search" type="search" placeholder="Szukaj przeciwnika…" /><div id="category-filters" class="filters"></div></div>
        <div id="library-list" class="library-grid"></div>
        <div id="library-empty" class="empty-state"><span>♜</span><h3>Biblioteka jest pusta.</h3><p>Zapisz stworzonego przeciwnika, aby wykorzystać go później.</p></div>
      </section>
    </main>
    <template id="battle-card-template"><article class="battle-card"><div class="card-top"><div><p class="enemy-tier"></p><h3 class="enemy-name"></h3><p class="enemy-kind"></p></div><div class="card-actions"><button class="icon-button clone" title="Dodaj kopię">⊕</button><button class="icon-button remove" title="Usuń ze starcia">×</button></div></div><div class="combat-stats"><div class="meter"><p>WYTRZYMAŁOŚĆ</p><strong class="endurance-display"></strong><div class="adjusters"><button data-stat="endurance" data-change="-5">−5</button><button data-stat="endurance" data-change="-1">−1</button><button data-stat="endurance" data-change="1">+1</button><button data-stat="endurance" data-change="5">+5</button></div></div><div class="meter hate-meter"><p class="resource-display-label">NIENAWIŚĆ</p><strong class="hate-display"></strong><div class="adjusters"><button data-stat="hate" data-change="-1">−1</button><button data-stat="hate" data-change="1">+1</button></div></div></div><div class="facts"><span>Zajadłość <b class="fierceness-display"></b></span><span>Potęga <b class="might-display"></b></span><span>Obrona <b class="parry-display"></b></span><span>Pancerz <b class="armour-display"></b></span></div><p class="attack-display detail"></p><p class="traits-display detail"></p><button class="defeated">Oznacz jako pokonanego</button></article></template>
    <script src="vendor/Sortable.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
